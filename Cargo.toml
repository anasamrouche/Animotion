[package]
name = "animotion"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "animotion"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.102"
bytemuck = { version = "1.25.0", features = ["derive"] }
env_logger = "0.11.10"
pollster = "0.4.0"
pyo3 = "0.28.2"
wgpu = "29.0.3"
winit = "0.30.13"
